# Doc Intelligence Pipeline Configuration
# Auto-generated by install.sh -- platform paths are adjusted at install time.
# Modify this file directly in the root after install.

[memory]
# Maximum disk space the pipeline is allowed to use (in GB).
# The install script checks this before creating the root.
max_disk_gb = 2

# ---------------------------------------------------------------------------
# Scan targets -- platform-specific lists of directories to walk.
# The install script selects the correct list based on OS detection.
# ---------------------------------------------------------------------------

[scan]
# Windows scan directories (used when OS == windows)
directories_win = [
    "%USERPROFILE%\\Downloads",
    "%USERPROFILE%\\Desktop",
    "%USERPROFILE%\\Documents",
    "%USERPROFILE%\\OneDrive",
]

# macOS scan directories (used when OS == macos)
directories_mac = [
    "~/Downloads",
    "~/Desktop",
    "~/Documents",
    "~/Library/CloudStorage",
]

# Linux scan directories (used when OS == linux)
directories_linux = [
    "~/Downloads",
    "~/Desktop",
    "~/Documents",
]

# Walk subdirectories recursively
recursive = true

# Maximum directory depth (safety cap to avoid full disk walks)
max_depth = 8

# File extensions to collect (lowercase, with dot)
file_types = [".docx"]

# Minimum file size in bytes (skip empty/corrupt files)
min_size_bytes = 1024

# ---------------------------------------------------------------------------
# Cron / Scheduler
# ---------------------------------------------------------------------------

[cron]
# Cron expression for the daily scan (5-field: min hour dom month dow)
schedule = "0 6 * * *"

# Whether the cron job is active
enabled = true

# Path to the pipeline script (set by install.sh)
pipeline_script = "scripts/pipeline.py"

# ---------------------------------------------------------------------------
# Extraction settings
# ---------------------------------------------------------------------------

[extraction]
# Pause between batch parses (milliseconds)
pause_ms = 1000

# Number of files to process before pausing
batch_size = 10

# Skip files already in the manifest (incremental mode)
incremental = true

# ---------------------------------------------------------------------------
# Knowledge extraction toggles
# ---------------------------------------------------------------------------

[knowledge]
# Detect imperative hints (Tip:, Note:, should, must, etc.)
detect_hints = true

# Find words/phrases repeating across >= 3 documents
detect_repetitive_words = true

# Identify document structure patterns (headings, tables, lists)
detect_layout_patterns = true

# Detect images/objects reused across documents
detect_reused_assets = true

# Find near-duplicate documents
detect_duplicates = true

# Language used when flagging duplicates -- must be SOFT, never accusatory
duplicate_flag = "might be a small change - investigate"

# MinHash similarity threshold for duplicate detection (0.0 - 1.0)
similarity_threshold = 0.85

# Minimum number of documents for cross-document analysis
min_corpus_size = 3

# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------

[actions]
# Generate summary .docx report after extraction
generate_docx = true

# Send notifications via WhatsApp (requires Hermes gateway)
whatsapp_send = true

# Stop pipeline after all documents are processed
stop_on_complete = false

# Output directory for generated reports
output_dir = "actions"

# ---------------------------------------------------------------------------
# Proctor / Validation
# ---------------------------------------------------------------------------

[proctor]
# Validate pipeline state after each scan
validate_after_scan = true

# Validate pipeline state after each extraction run
validate_after_extraction = true

# Fail loudly if validation fails (false = warn only)
strict = true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
level = "INFO"

# Log file path (relative to root)
log_file = "logs/pipeline.log"

# Max log file size before rotation (bytes)
max_log_size = 10485760

# Number of rotated log files to keep
backup_count = 5
